apiVersion: apps/v1
kind: Deployment
metadata:
  name: tearenvd
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      serviceAccountName: tearenvd
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-state
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              if [ ! -s /var/lib/tearenv/users.json ]; then
                cp /bootstrap/users.json /var/lib/tearenv/users.json
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: state
              mountPath: /var/lib/tearenv
      containers:
        - name: tearenvd
          image: ghcr.io/fr0stylo/tearenv:latest
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --listen=:2222
            - --metrics-listen=:9090
            - --users=/var/lib/tearenv/users.json
            - --host-key=/var/lib/tearenv/ssh_host_ed25519_key
            - --api-listen=:8080
            - --registrations=/var/lib/tearenv/registrations
            - --registration-namespace=default
            - --registration-auth-mode=token
            - --registration-token-file=/etc/tearenv/registration-auth/token
            - --scaler=kubernetes
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: registration
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: registration
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: registration
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: state
              mountPath: /var/lib/tearenv
            - name: registration-auth
              mountPath: /etc/tearenv/registration-auth
              readOnly: true
      volumes:
        - name: bootstrap
          secret:
            secretName: tearenvd-bootstrap
            defaultMode: 0440
            items:
              - key: users.json
                path: users.json
        - name: state
          persistentVolumeClaim:
            claimName: tearenvd-state
        - name: registration-auth
          secret:
            secretName: tearenvd-registration
            defaultMode: 0440
            items:
              - key: token
                path: token
