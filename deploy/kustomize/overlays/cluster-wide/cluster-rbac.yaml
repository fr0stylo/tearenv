apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tearenvd-scaler
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tearenvd-scaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tearenvd-scaler
subjects:
  - kind: ServiceAccount
    name: tearenvd
    namespace: tearenv-system
