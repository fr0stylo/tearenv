apiVersion: tearenv.io/v1alpha1
kind: EnvironmentBlueprint
metadata:
  name: developer-environment
spec:
  namespace:
    nameTemplate: tearenv-{{ .IdentitySlug }}-{{ .BlueprintName }}
    labels:
      app.kubernetes.io/managed-by: tearenv
      tearenv.io/blueprint: "{{ .BlueprintName }}"
      tearenv.io/identity: "{{ .IdentitySlug }}"
  resources:
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workspace
        labels:
          app.kubernetes.io/name: workspace
      spec:
        replicas: 0
        selector:
          matchLabels:
            app.kubernetes.io/name: workspace
        template:
          metadata:
            labels:
              app.kubernetes.io/name: workspace
          spec:
            containers:
              - name: web
                image: nginx:1.27-alpine
                ports:
                  - name: http
                    containerPort: 80
    - apiVersion: v1
      kind: Service
      metadata:
        name: workspace
      spec:
        selector:
          app.kubernetes.io/name: workspace
        ports:
          - name: http
            port: 80
            targetPort: http
  services:
    - name: web
      localPort: 8080
      target:
        service: workspace
        port: 80
      scale:
        targetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: workspace
        replicas: 1
        readyTimeout: 2m
        idleTimeout: 10m
