{{- if and .Values.blueprint.enabled (not .Values.scaler.kubernetes.enabled) }}
{{- fail "blueprint.enabled requires scaler.kubernetes.enabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tearenv.fullname" . }}
  labels:
    {{- include "tearenv.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tearenv.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tearenv.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "tearenv.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: initialize-state
          image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
          imagePullPolicy: {{ .Values.initImage.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              if [ ! -s /var/lib/tearenv/users.json ]; then
                cp /bootstrap/{{ .Values.bootstrap.secretKey }} /var/lib/tearenv/users.json
              fi
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: state
              mountPath: /var/lib/tearenv
      containers:
        - name: tearenvd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen=:2222
            {{- if .Values.metrics.enabled }}
            - --metrics-listen=:{{ .Values.metrics.port }}
            {{- else }}
            - --metrics-listen=
            {{- end }}
            - --users=/var/lib/tearenv/users.json
            - --host-key=/var/lib/tearenv/ssh_host_ed25519_key
            - --api-listen=:{{ .Values.registration.port }}
            - --registrations=/var/lib/tearenv/registrations
            - --registration-namespace={{ .Values.registration.namespace }}
            - --registration-token-file=/etc/tearenv/registration-auth/{{ .Values.registration.token.secretKey }}
            {{- if .Values.scaler.kubernetes.enabled }}
            - --scaler=kubernetes
            {{- end }}
            {{- if .Values.blueprint.enabled }}
            - --blueprint=/etc/tearenv/blueprint/{{ .Values.blueprint.configMapKey }}
            {{- end }}
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
            - name: registration
              containerPort: {{ .Values.registration.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: registration
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: registration
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/tearenv
            - name: registration-auth
              mountPath: /etc/tearenv/registration-auth
              readOnly: true
            {{- if .Values.blueprint.enabled }}
            - name: blueprint
              mountPath: /etc/tearenv/blueprint
              readOnly: true
            {{- end }}
      volumes:
        - name: bootstrap
          secret:
            secretName: {{ include "tearenv.bootstrapSecretName" . }}
            defaultMode: 0440
            items:
              - key: {{ .Values.bootstrap.secretKey }}
                path: {{ .Values.bootstrap.secretKey }}
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "tearenv.stateClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: registration-auth
          secret:
            secretName: {{ include "tearenv.registrationSecretName" . }}
            defaultMode: 0440
            items:
              - key: {{ .Values.registration.token.secretKey }}
                path: {{ .Values.registration.token.secretKey }}
        {{- if .Values.blueprint.enabled }}
        - name: blueprint
          configMap:
            name: {{ include "tearenv.blueprintConfigMapName" . }}
            items:
              - key: {{ .Values.blueprint.configMapKey }}
                path: {{ .Values.blueprint.configMapKey }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
