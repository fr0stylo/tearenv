replicaCount: 1

image:
  repository: ghcr.io/fr0stylo/tearenv
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion. Pin this to a digest or immutable release tag in production.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 2222
  annotations: {}

registration:
  namespace: default
  port: 8080
  # Exactly one authentication mode is active: token or oidc.
  authMode: token
  token:
    # Leave empty for Helm to generate and preserve a token. Set this for GitOps.
    existingSecret: ""
    secretKey: token
  oidc:
    # external uses an existing OIDC issuer. bundledDex deploys the optional
    # Dex chart below and derives the issuer from dex.config.issuer.
    provider: external
    issuerURL: ""
    clientID: tearenv-cli
    audience: tearenv
    identityClaim: preferred_username
    # ID tokens work with Dex, Keycloak, and most interactive OIDC providers.
    # Use access-token only when the issuer provides RFC 9068 at+jwt tokens.
    subjectTokenType: id-token
    scopes:
      - openid
      - profile
    deviceFlow: false
    ca:
      # Optional CA bundle for a privately signed issuer certificate.
      existingSecret: ""
      secretKey: ca.crt
    sshUserCA:
      # Required in OIDC mode. The Secret key must contain an unencrypted
      # OpenSSH or PEM private key used only to sign short-lived user certs.
      existingSecret: ""
      secretKey: ca_key
      certificateTTL: 10m
      clockSkew: 30s
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /
    tls:
      enabled: true
      secretName: ""

metrics:
  enabled: true
  port: 9090

bootstrap:
  # Use existingSecret for production so policy data is not stored in Helm release values.
  existingSecret: ""
  secretKey: users.json
  policy: |
    {
      "access": {
        "configure-me": {
          "services": {}
        }
      }
    }

blueprint:
  enabled: false
  # Set existingConfigMap to a team-managed ConfigMap in production.
  existingConfigMap: ""
  configMapKey: environment-blueprint.yaml
  # Used to create a ConfigMap when existingConfigMap is empty.
  document: ""

persistence:
  enabled: true
  existingClaim: ""
  keep: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

scaler:
  kubernetes:
    enabled: true
  rbac:
    create: true
    # Namespaced Roles are safer. An empty list grants access only in the release namespace.
    namespaces: []
    clusterWide: false

initImage:
  repository: busybox
  tag: "1.37"
  pullPolicy: IfNotPresent

podAnnotations: {}
podLabels: {}
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi
terminationGracePeriodSeconds: 45
nodeSelector: {}
tolerations: []
affinity: {}

# Optional official Dex subchart. Set registration.authMode=oidc,
# registration.oidc.provider=bundledDex, and dex.enabled=true together.
dex:
  enabled: false
  replicaCount: 2
  config:
    issuer: ""
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
    staticClients:
      - id: tearenv-cli
        name: Tearenv CLI
        public: true
    # Add GitHub, Google, LDAP, or another connector before enabling Dex.
    connectors: []
  envFrom: []
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
