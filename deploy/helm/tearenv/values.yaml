replicaCount: 1

image:
  repository: ghcr.io/fr0stylo/tearenv
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion. Pin this to a digest or immutable release tag in production.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 2222
  annotations: {}

registration:
  namespace: default
  port: 8080
  token:
    # Leave empty for Helm to generate and preserve a token. Set this for GitOps.
    existingSecret: ""
    secretKey: token
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /
    tls:
      enabled: true
      secretName: ""

metrics:
  enabled: true
  port: 9090

bootstrap:
  # Use existingSecret for production so policy data is not stored in Helm release values.
  existingSecret: ""
  secretKey: users.json
  policy: |
    {
      "access": {
        "configure-me": {
          "services": {}
        }
      }
    }

blueprint:
  enabled: false
  # Set existingConfigMap to a team-managed ConfigMap in production.
  existingConfigMap: ""
  configMapKey: environment-blueprint.yaml
  # Used to create a ConfigMap when existingConfigMap is empty.
  document: ""

persistence:
  enabled: true
  existingClaim: ""
  keep: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

scaler:
  kubernetes:
    enabled: true
  rbac:
    create: true
    # Namespaced Roles are safer. An empty list grants access only in the release namespace.
    namespaces: []
    clusterWide: false

initImage:
  repository: busybox
  tag: "1.37"
  pullPolicy: IfNotPresent

podAnnotations: {}
podLabels: {}
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi
terminationGracePeriodSeconds: 45
nodeSelector: {}
tolerations: []
affinity: {}
